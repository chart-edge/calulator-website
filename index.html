
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .calculator {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0002;
      width: min(320px, 85vw);
    }
    h2 { text-align: center; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      font-size: 22px;
      margin-bottom: 12px;
      text-align: right;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      padding: 16px 8px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      background: #e4eaf2;
      cursor: pointer;
    }
    button:hover { background: #cdd9e8; }
    .equal { background: #1769e0; color: white; }
  </style>
</head>
<body>
  <main class="calculator">
    <h2>Calculator</h2>
    <input id="display" value="0" readonly aria-label="Calculator display">
    <div class="buttons">
      <button onclick="clearDisplay()">AC</button>
      <button onclick="backspace()">DEL</button>
      <button onclick="choose('/')">÷</button>
      <button onclick="choose('*')">×</button>
      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button onclick="choose('-')">−</button>
      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button onclick="choose('+')">+</button>
      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button onclick="calculate()" class="equal">=</button>
      <button onclick="digit('0')">0</button>
      <button onclick="digit('.')">.</button>
    </div>
  </main>
  <script>
    const display = document.getElementById('display');
    let current = '0', previous = null, operator = null, fresh = false;

    function update() { display.value = current; }
    function digit(n) {
      if (fresh) { current = n === '.' ? '0.' : n; fresh = false; }
      else if (n === '.' && current.includes('.')) return;
      else current = current === '0' && n !== '.' ? n : current + n;
      update();
    }
    function choose(op) {
      if (operator && !fresh) calculate();
      previous = Number(current);
      operator = op;
      fresh = true;
    }
    function calculate() {
      if (operator === null || previous === null) return;
      const a = previous, b = Number(current);
      let result;
      if (operator === '+') result = a + b;
      if (operator === '-') result = a - b;
      if (operator === '*') result = a * b;
      if (operator === '/') result = b === 0 ? NaN : a / b;
      current = Number.isFinite(result)
        ? String(Number(result.toPrecision(12))) : 'Error';
      previous = null;
      operator = null;
      fresh = true;
      update();
    }
    function clearDisplay() {
      current = '0'; previous = null; operator = null; fresh = false;
      update();
    }
    function backspace() {
      if (fresh || current === 'Error') return clearDisplay();
      current = current.length > 1 ? current.slice(0, -1) : '0';
      update();
    }
  </script>
</body>
</html>
